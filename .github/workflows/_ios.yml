# iOS の未署名 IPA(SideStore がインストール時に署名する)を作る(再利用 workflow)。
name: iOS IPA (reusable)

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      configuration:
        type: string
        required: false
        default: Release

jobs:
  ipa:
    # 開発 VM と同じ Intel の macOS 26(Xcode 26)。RAM 14GB・4コアで Kotlin/Native の Release(6GB)に余裕がある。
    runs-on: ${{ vars.IOS_RUNNER || 'macos-26-intel' }}
    timeout-minutes: 150
    env:
      CONFIGURATION: ${{ inputs.configuration }}
      # 空なら本体の Xcode ビルドフェーズの既定 -Xmx6g を使う。
      FUTABA_IOS_GRADLE_JVMARGS: ${{ vars.IOS_GRADLE_JVMARGS || '' }}
    steps:
      - name: ビルド基盤(このリポジトリ)
        uses: actions/checkout@v5

      - name: 本体の場所(Secret SOURCE_REPOSITORY)の確認
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
        run: test -n "$SOURCE_REPOSITORY" || { echo "::error::Secret SOURCE_REPOSITORY(本体の owner/名前)が未設定"; exit 1; }

      - name: 本体のソース(非公開)
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.FUTABAVIEWER_SOURCE_TOKEN }}
          path: source
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ vars.IOS_XCODE_VERSION || 'latest-stable' }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        with:
          build-scan-publish: false

      # Kotlin/Native のコンパイラと LLVM(初回 1GB 超)。
      - uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('source/gradle/libs.versions.toml') }}

      # MobileVLCKit / VOICEVOX の配布物(本体のスクリプトが SHA-256 で検証する)。
      - uses: actions/cache@v5
        with:
          path: source/app-ios/vendor
          key: ios-vendor-${{ hashFiles('source/app-ios/setup-vlckit.sh', 'source/app-ios/setup-voicevox.sh') }}

      - name: 準備(Android SDK / 秘密の設定)
        env:
          CACHE_SERVER_APP_TOKEN_NEW: ${{ secrets.CACHE_SERVER_APP_TOKEN_NEW }}
          GOOGLE_OAUTH_IOS_PLIST_BASE64: ${{ secrets.GOOGLE_OAUTH_IOS_PLIST_BASE64 }}
        run: bash scripts/ios/prepare.sh source

      - name: Build IPA
        run: bash source/app-ios/build-ipa.sh

      - name: 成果物の名前を付ける
        id: stage
        run: bash scripts/ios/stage-ipa.sh source "$CONFIGURATION"

      - uses: actions/upload-artifact@v6
        with:
          name: ios-ipa-${{ inputs.configuration }}
          path: ${{ steps.stage.outputs.path }}
          if-no-files-found: error
          retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS || 7 }}

      - name: 後片付け
        if: always()
        run: rm -rf source/memo/google_oauth source/local.properties
