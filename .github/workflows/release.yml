# 本体(非公開)のタグから、配布物をまとめて作ってこのリポジトリの Release に置く。
#
# - FixPatch〇〇 … master 系: Android APK(新署名版 / ZipSigner版)+ Windows インストーラー + iOS IPA
# - old-ui〇〇   … old-ui 系: Android APK(新署名版 / ZipSigner版)だけ
#
# 本体のタグ push で本体側の dispatch-build.yml がこれを起動する。手動でも Run workflow から動かせる。
name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 本体のタグ(FixPatch〇〇 / old-ui〇〇)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      line: ${{ steps.resolve.outputs.line }}
    steps:
      - id: resolve
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^(FixPatch|old-ui)[0-9A-Za-z._-]*$ ]]; then
            echo "::error::タグは FixPatch〇〇 か old-ui〇〇 にしてください"
            exit 1
          fi
          case "$TAG" in
            FixPatch*) echo "line=master" >> "$GITHUB_OUTPUT" ;;
            old-ui*)   echo "line=old-ui" >> "$GITHUB_OUTPUT" ;;
          esac

  android:
    needs: resolve
    uses: ./.github/workflows/_android.yml
    with:
      source_ref: ${{ inputs.tag }}
      line: ${{ needs.resolve.outputs.line }}
    secrets: inherit

  windows:
    needs: resolve
    if: needs.resolve.outputs.line == 'master'
    uses: ./.github/workflows/_windows.yml
    with:
      source_ref: ${{ inputs.tag }}
    secrets: inherit

  ios:
    needs: resolve
    if: needs.resolve.outputs.line == 'master'
    uses: ./.github/workflows/_ios.yml
    with:
      source_ref: ${{ inputs.tag }}
      configuration: Release
    secrets: inherit

  publish:
    needs: [resolve, android, windows, ios]
    # old-ui は Android だけ、master は3つ全部が成功したときだけ公開する(欠けた Release を作らない)。
    if: >-
      always() &&
      needs.android.result == 'success' &&
      (needs.resolve.outputs.line == 'old-ui' ||
       (needs.windows.result == 'success' && needs.ios.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # master 系だけ iOS がある。SideStore / LiveContainer に登録するソース(Latest の source.json)を作る。
      - name: SideStore / LiveContainer のソース
        if: needs.resolve.outputs.line == 'master'
        run: python3 scripts/release/altstore-source.py dist "${{ inputs.tag }}" dist/source.json

      - name: チェックサム
        run: |
          cd dist
          sha256sum -- * | tee SHA256SUMS.txt

      - name: 説明文
        env:
          TAG: ${{ inputs.tag }}
          LINE: ${{ needs.resolve.outputs.line }}
        run: |
          {
            echo "FutabaViewer ${TAG}"
            echo
            echo "| ファイル | 内容 |"
            echo "|---|---|"
            echo '| `*-new-signature.apk` | Android 新署名版 |'
            echo '| `*-zipsigner.apk` | Android ZipSigner版(旧署名) |'
            if [ "$LINE" = master ]; then
              echo '| `FutabaViewer-Windows-*.exe` / `.msi` | Windows インストーラー |'
              echo '| `FutabaViewer-iOS-*.ipa` | iOS(SideStore 用の未署名 IPA) |'
              echo '| `source.json` / `FutabaViewer-iOS-icon.png` | SideStore / LiveContainer に登録するソース(自動更新用) |'
            fi
            echo '| `SHA256SUMS.txt` | 各ファイルの SHA-256 |'
            echo
            echo "変更点はアプリ内の「更新履歴」を参照。"
            echo
            echo "- master 系(FixPatch)の最新: https://github.com/${GITHUB_REPOSITORY}/releases/latest"
            echo "- old-ui 系の一覧(新しい順): https://github.com/${GITHUB_REPOSITORY}/releases?q=old-ui&expanded=true"
          } > release-body.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body_path: release-body.md
          # GitHub の Latest は1つだけなので master 系(FixPatch)に固定する。old-ui を出しても Latest は動かない。
          make_latest: ${{ needs.resolve.outputs.line == 'master' && 'true' || 'false' }}
          files: dist/*
